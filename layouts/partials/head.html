<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="F9QVrswD5LfpjHmOQxsq4QeUQVfHcya0LHb36dW3G-c" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

<!-- SEO: description -->
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">

<!-- SEO: canonical (har page ka asli URL) -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- SEO: robots -->
{{ if or (eq .Kind "taxonomy") (eq .Kind "term") }}
<meta name="robots" content="noindex, follow">
{{ else }}
<meta name="robots" content="index, follow">
{{ end }}

<!-- Google Fonts Integration (Added Cormorant Garamond for Editorial Luxury Style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">

<script src="https://f.convertkit.com/ckjs/ck.5.js" async></script>
