content:
  - name: posts
    label: Blog Articles
    folder: content/posts
    type: collection
    path: "{slug}/index.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: datetime, required: true }
      - { name: draft, label: Draft Status, type: boolean, default: false }
      - { name: categories, label: Categories, type: list }
      - { name: tags, label: Tags, type: list }
      - { name: image, label: R2 Image URL, type: string }
      - { name: body, label: Content, type: rich-text }